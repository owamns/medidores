services:
  meter-api:
    build: .
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-8G}
          cpus: ${CPU_LIMIT:-4.0}
        reservations:
          memory: ${MEMORY_RESERVATION:-4G}
          cpus: ${CPU_RESERVATION:-2.0}
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}

    volumes:
      - model_cache:/home/appuser/.cache
      - ultralytics_config:/home/appuser/.config/Ultralytics

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5000}/health"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-15s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${HEALTH_CHECK_START_PERIOD:-120s}

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model_cache:
  ultralytics_config: